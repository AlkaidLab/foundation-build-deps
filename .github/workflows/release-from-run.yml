---
name: Release from Run
permissions: {}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID that already produced build artifacts.
        required: true
        type: string
      tag:
        description: Release tag to create/update. Leave empty to auto-generate a UTC CalVer tag.
        required: false
        type: string
      target_commitish:
        description: Commit/tag/branch for the release tag. Leave empty to use the source run head SHA.
        required: false
        type: string
      draft:
        description: Create/update the release as draft.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Create/update the release as prerelease.
        required: true
        default: true
        type: boolean

jobs:
  release:
    name: Release Existing Artifacts
    if: startsWith(github.repository, 'AlkaidLab/')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET_COMMITISH: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="v$(date -u +%Y).$(date -u +%-m%d).$(date -u +%-H%M%S)"
          fi

          target_commitish="${INPUT_TARGET_COMMITISH}"
          if [[ -z "${target_commitish}" ]]; then
            target_commitish="$(gh run view "${INPUT_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json headSha --jq .headSha)"
          fi

          source_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN_ID}"

          {
            echo "tag=${tag}"
            echo "target_commitish=${target_commitish}"
            echo "body<<EOF"
            echo "Recovered release from existing CI artifacts."
            echo
            echo "- Source run: ${source_run_url}"
            echo "- Target commit: ${target_commitish}"
            echo "- Reason: publish/release-only recovery without rebuilding the full matrix."
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "tag=${tag}"
          echo "target_commitish=${target_commitish}"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          artifact_count="$(find artifacts -type f -name '*.tar.gz' | wc -l)"
          echo "artifact_count=${artifact_count}"
          if [[ "${artifact_count}" -eq 0 ]]; then
            echo "No .tar.gz artifacts were downloaded." >&2
            exit 1
          fi

      - name: Create/Update GitHub Release
        uses: LizardByte/actions/actions/release_create@4125866b7b655a6fe038b0e22a43a4c5d259af79  # v2026.417.35446
        with:
          allowUpdates: true
          body: ${{ steps.metadata.outputs.body }}
          draft: ${{ inputs.draft }}
          generateReleaseNotes: false
          name: ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ steps.metadata.outputs.tag }}
          token: ${{ secrets.GH_BOT_TOKEN || github.token }}
